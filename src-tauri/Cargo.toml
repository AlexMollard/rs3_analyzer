[package]
name = "rs3_analyzer"
version = "0.2.0"
description = "RuneScape 3 Grand Exchange flip analyzer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rs3_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled"] }
statrs = "0.19.1"
